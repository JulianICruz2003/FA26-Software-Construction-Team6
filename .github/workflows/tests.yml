name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install server, desktop, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/server.txt -r requirements/desktop.txt "pytest>=8,<10"
      - name: Run tests
        env:
          RUN_POSTGRES_TESTS: "1"
        run: python -m pytest -q
